services:
  searxng:
    # SEARXNG_IMAGE lets run-local.ps1 point straight at a Chinese registry
    # mirror (e.g. docker.m.daocloud.io/searxng/searxng:latest) when
    # daemon.json registry-mirrors is not in effect yet. This matters because
    # registry-1.docker.io / auth.docker.io / production.cloudflare.docker.com
    # are all DNS-poisoned on this network.
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: searxng
    restart: unless-stopped
    ports:
      # Bound to loopback on purpose: only this machine can reach it, which is
      # exactly what MimirLink needs. Nothing is exposed to the LAN or the
      # internet, so no firewall or auth layer is required.
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:${SEARXNG_PORT:-8888}/
    # The campus resolvers (www.digi.cdut.edu.cn / secdns.cdut.edu.cn) answer
    # yandex.com and yandex.ru with NXDOMAIN -- a domain-level block, not
    # poisoning, so a hosts-file entry cannot fix it. The IPs themselves are
    # perfectly reachable: 77.88.55.88 / 77.88.44.55 / 5.255.255.77 all accept
    # :443 from inside the container. Pointing the container at public
    # resolvers restores the engine without touching anything else.
    # Verified: yandex.com resolves again, bing/baidu/360 keep working.
    dns:
      - 223.5.5.5
      - 119.29.29.29
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
